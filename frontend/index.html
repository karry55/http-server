<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>待办事项</title>
<style>
/* ============================================================
   设计变量
   ============================================================ */
:root {
  --primary:        #6366f1;   /* 主色：柔和蓝紫 */
  --primary-dark:   #4f46e5;
  --primary-light:  #eef2ff;   /* 一键总结按钮用 */
  --primary-border: #c7d2fe;
  --blue:           #3b82f6;   /* 分类按钮用的蓝 */
  --blue-light:     #eff6ff;
  --blue-border:    #bfdbfe;
  --amber:          #d97706;   /* 优先级按钮用的琥珀色 */
  --amber-light:    #fffbeb;
  --amber-border:   #fde68a;
  --teal:           #0d9488;   /* 拆分按钮用的青绿 */
  --teal-light:     #f0fdfa;
  --teal-border:    #99f6e4;
  --danger:         #ef4444;   /* 删除按钮用的红 */
  --danger-light:   #fef2f2;
  --danger-border:  #fecaca;
  --success:        #10b981;

  --text:           #1f2937;   /* 正文深灰 */
  --text-muted:     #6b7280;
  --text-faint:     #9ca3af;
  --border:         #e5e7eb;
  --surface:        #ffffff;

  --radius-lg:      12px;      /* 卡片圆角 */
  --radius:         8px;       /* 按钮 / 输入框圆角 */

  --shadow-card:    0 1px 3px rgba(17, 24, 39, .06), 0 8px 24px rgba(17, 24, 39, .06);
  --shadow-focus:   0 0 0 3px rgba(99, 102, 241, .15);
  --shadow-toast:   0 6px 20px rgba(17, 24, 39, .18);
  --shadow-modal:   0 20px 50px rgba(17, 24, 39, .22);

  --t: .2s ease;               /* 统一过渡时长 */
}

/* ============================================================
   基础
   ============================================================ */
* { box-sizing: border-box; }

/* 保证 hidden 属性永远生效（否则会被后面的 display:flex 之类覆盖） */
[hidden] { display: none !important; }

body {
  margin: 0;
  min-height: 100vh;
  padding: 0;
  background: linear-gradient(180deg, #f9fafb 0%, #f3f4f6 100%);
  background-attachment: fixed;
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
               "Microsoft YaHei", sans-serif;
  font-size: 16px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

/* ============================================================
   页面骨架
   ============================================================ */
.page {
  max-width: 600px;
  margin: 0 auto;
  padding: 48px 20px 64px;
}

.header {
  display: flex;
  align-items: center;
  gap: 10px;
  margin: 0 0 20px 4px;
}
.header .logo { font-size: 26px; line-height: 1; }
/* 「一键总结」和「AI 助手」打包推到最右，两个按钮之间保持间距 */
.header-actions {
  display: flex;
  gap: 8px;
  margin-left: auto;
}
.header h1 {
  margin: 0;
  font-size: 24px;
  font-weight: 700;
  letter-spacing: -.01em;
}

.card {
  background: var(--surface);
  border: 1px solid rgba(229, 231, 235, .7);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-card);
  padding: 20px;
}

/* ============================================================
   输入区
   ============================================================ */
.composer {
  display: flex;
  gap: 10px;
  margin-bottom: 8px;
}

.input {
  flex: 1 1 auto;
  min-width: 0;
  padding: 12px 14px;
  font-family: inherit;
  font-size: 16px;
  color: var(--text);
  background: #fff;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  outline: none;
  transition: border-color var(--t), box-shadow var(--t);
}
.input::placeholder { color: var(--text-faint); }
.input:focus {
  border-color: var(--primary);
  box-shadow: var(--shadow-focus);
}

/* ============================================================
   按钮
   ============================================================ */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  flex-shrink: 0;
  white-space: nowrap;              /* 按钮文字永不换行 */
  padding: 10px 16px;
  font-family: inherit;
  font-size: 14px;
  font-weight: 500;
  line-height: 1.2;
  border: 1px solid transparent;
  border-radius: var(--radius);
  cursor: pointer;
  transition: background-color var(--t), border-color var(--t), color var(--t),
              transform var(--t), box-shadow var(--t);
}
.btn:hover:not(:disabled)  { transform: scale(1.04); }
.btn:active:not(:disabled) { transform: scale(.96); }
.btn:disabled { opacity: .5; cursor: not-allowed; transform: none; }

.btn-primary  { background: var(--primary); color: #fff; box-shadow: 0 1px 2px rgba(99,102,241,.35); }
.btn-primary:hover:not(:disabled)  { background: var(--primary-dark); }

.btn-classify { background: var(--blue-light);   color: #2563eb;      border-color: var(--blue-border); }
.btn-classify:hover:not(:disabled) { background: #dbeafe; border-color: #93c5fd; }

.btn-priority { background: var(--amber-light); color: var(--amber); border-color: var(--amber-border); }
.btn-priority:hover:not(:disabled) { background: #fef3c7; border-color: #fcd34d; }

.btn-summarize { background: var(--primary-light); color: var(--primary-dark); border-color: var(--primary-border); font-weight: 600; }
.btn-summarize:hover:not(:disabled) { background: #e0e7ff; border-color: #a5b4fc; }

.btn-split    { background: var(--teal-light); color: var(--teal); border-color: var(--teal-border); }
.btn-split:hover:not(:disabled) { background: #ccfbf1; border-color: #5eead4; }

.btn-edit     { background: #f3f4f6;  color: #4b5563; border-color: var(--border); }
.btn-edit:hover:not(:disabled)     { background: #e5e7eb; border-color: #d1d5db; }

.btn-danger   { background: var(--danger-light); color: var(--danger); border-color: var(--danger-border); }
.btn-danger:hover:not(:disabled)   { background: #fee2e2; border-color: #fca5a5; }

.btn-ghost    { background: #fff; color: var(--text-muted); border-color: var(--border); }
.btn-ghost:hover:not(:disabled)    { background: #f9fafb; }

.btn-sm { padding: 6px 10px; font-size: 13px; }

/* ============================================================
   列表
   ============================================================ */
.list { list-style: none; margin: 0; padding: 0; }

.todo-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px;
  margin: 2px -12px;
  border-radius: var(--radius);
  border-bottom: 1px solid #f3f4f6;
  transition: background-color var(--t), opacity var(--t), transform var(--t);
  animation: itemIn .25s ease both;
}
.todo-item:last-child { border-bottom: none; }
.todo-item:hover      { background: #f9fafb; }

/* 删除时的淡出 */
.todo-item.is-leaving {
  animation: itemOut .22s ease forwards;
  pointer-events: none;
}

.todo-content {
  flex: 1 1 auto;
  min-width: 0;
  font-size: 16px;
  overflow-wrap: anywhere;          /* 超长单词也能折行 */
}

.todo-actions {
  display: flex;
  gap: 6px;
  flex-shrink: 0;
}

@keyframes itemIn  { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: none; } }
@keyframes itemOut { to   { opacity: 0; transform: translateX(16px); } }

/* 空状态 */
.empty {
  padding: 40px 20px;
  text-align: center;
  color: var(--text-faint);
  font-size: 15px;
}
.empty .empty-icon {
  display: block;
  margin-bottom: 12px;
  font-size: 40px;
  opacity: .75;
}

/* ============================================================
   骨架屏（首次加载）
   ============================================================ */
.skeleton {
  height: 46px;
  margin: 8px 0;
  border-radius: var(--radius);
  background: linear-gradient(90deg, #f3f4f6 25%, #e9ebef 37%, #f3f4f6 63%);
  background-size: 400% 100%;
  animation: shimmer 1.4s ease infinite;
}
@keyframes shimmer {
  0%   { background-position: 100% 0; }
  100% { background-position: 0 0; }
}

/* ============================================================
   Toast 提示
   ============================================================ */
#toasts {
  position: fixed;
  top: 20px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 1000;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
  width: calc(100% - 40px);
  max-width: 420px;
  pointer-events: none;
}

.toast {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 11px 18px;
  border-radius: var(--radius);
  font-size: 14px;
  font-weight: 500;
  color: #fff;
  box-shadow: var(--shadow-toast);
  animation: toastIn .25s cubic-bezier(.2, .9, .3, 1.2) both;
}
.toast.is-leaving { animation: toastOut .22s ease forwards; }
.toast.success { background: var(--success); }
.toast.error   { background: var(--danger); }
.toast.info    { background: var(--primary); }

@keyframes toastIn  { from { opacity: 0; transform: translateY(-14px) scale(.96); } to { opacity: 1; transform: none; } }
@keyframes toastOut { to   { opacity: 0; transform: translateY(-10px) scale(.96); } }

/* ============================================================
   弹窗
   ============================================================ */
.overlay {
  position: fixed;
  inset: 0;
  z-index: 900;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  background: rgba(17, 24, 39, .38);
  backdrop-filter: blur(3px);
  animation: fadeIn .18s ease both;
}
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

.modal {
  width: 100%;
  max-width: 380px;
  padding: 24px;
  background: #fff;
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-modal);
  text-align: center;
  animation: modalIn .22s cubic-bezier(.2, .9, .3, 1.15) both;
}
@keyframes modalIn { from { opacity: 0; transform: translateY(12px) scale(.97); } to { opacity: 1; transform: none; } }

.modal-icon  { font-size: 34px; line-height: 1; margin-bottom: 10px; }
.modal-title { margin: 0 0 10px; font-size: 17px; font-weight: 600; }
.modal-body  { margin-bottom: 20px; color: var(--text-muted); overflow-wrap: anywhere; }
.modal-actions { display: flex; gap: 10px; justify-content: center; }

.modal-source   { font-size: 14px; color: var(--text-faint); margin-bottom: 6px; }
.modal-category { font-size: 22px; font-weight: 700; color: var(--primary); }

/* 优先级徽章：高=红 / 中=琥珀 / 低=绿 */
.modal-priority {
  display: inline-block;
  min-width: 92px;
  padding: 6px 20px;
  border-radius: 999px;
  font-size: 20px;
  font-weight: 700;
}
.modal-priority.high { background: #fef2f2; color: #dc2626; }
.modal-priority.mid  { background: #fffbeb; color: var(--amber); }
.modal-priority.low  { background: #ecfdf5; color: #059669; }

/* AI 总结的正文 */
.modal-summary {
  font-size: 16px;
  line-height: 1.75;
  color: var(--text);
  text-align: left;
}

/* ============================================================
   拆分结果：子任务清单
   ============================================================ */
.modal-subtasks {
  margin: 0;
  padding-left: 22px;
  text-align: left;
  font-size: 15px;
  line-height: 1.6;
}
.modal-subtasks li { margin: 6px 0; overflow-wrap: anywhere; }

/* ============================================================
   AI 聊天面板
   ============================================================ */
.chat-card {
  display: flex;
  flex-direction: column;
  gap: 12px;
  margin-top: 16px;
}

.chat-head {
  display: flex;
  align-items: center;
  gap: 8px;
}
.chat-head .chat-title {
  font-size: 15px;
  font-weight: 600;
}
.chat-head .btn:first-of-type { margin-left: auto; }   /* 「清空」推到最右 */

.chat-log {
  display: flex;
  flex-direction: column;
  gap: 10px;
  max-height: 320px;
  overflow-y: auto;
  padding: 2px;
}

.chat-msg {
  max-width: 85%;
  padding: 9px 13px;
  border-radius: var(--radius);
  font-size: 14px;
  line-height: 1.6;
  white-space: pre-wrap;          /* 后端返回的多行文本按原样换行显示 */
  overflow-wrap: anywhere;
  animation: itemIn .2s ease both;
}
.chat-msg.user      { align-self: flex-end;   background: var(--primary);      color: #fff; }
.chat-msg.assistant { align-self: flex-start; background: #f3f4f6;             color: var(--text); }
.chat-msg.typing    { align-self: flex-start; background: #f3f4f6;             color: var(--text-muted); }
.chat-msg.error     { align-self: flex-start; background: var(--danger-light); color: var(--danger); border: 1px solid var(--danger-border); }

/* ============================================================
   跨域 / 连接失败 提示条
   ============================================================ */
.hint {
  margin-top: 16px;
  padding: 14px 16px;
  border: 1px solid #fde68a;
  border-radius: var(--radius);
  background: #fffbeb;
  color: #92400e;
  font-size: 14px;
  line-height: 1.7;
}
.hint code {
  padding: 1px 6px;
  border-radius: 4px;
  background: rgba(146, 64, 14, .1);
  font-size: 13px;
  overflow-wrap: anywhere;
}
.hint ol { margin: 8px 0 0; padding-left: 20px; }

/* ============================================================
   响应式：手机
   ============================================================ */
@media (max-width: 600px) {
  .page  { padding: 28px 14px 48px; }
  .card  { padding: 16px; }
  .header h1 { font-size: 22px; }

  .composer { gap: 8px; }

  /* 窄屏时内容与按钮分两行，按钮本身仍排成一行不换行 */
  .todo-item {
    flex-direction: column;
    align-items: stretch;
    gap: 10px;
  }
  .todo-actions { justify-content: flex-end; }

  /* 现在每条待办有 5 个按钮（分类/优先级/拆分/编辑/删除），窄屏要收紧并允许折行 */
  .todo-actions { gap: 4px; flex-wrap: wrap; }
  .todo-actions .btn { padding: 6px 8px; font-size: 12px; gap: 4px; }

  .chat-log { max-height: 240px; }
}

/* 超窄屏：按钮只留图标，鼠标悬停有 title 提示 */
@media (max-width: 400px) {
  .todo-actions .btn span:last-child { display: none; }
}
</style>
</head>
<body>

<div class="page">
  <header class="header">
    <span class="logo" aria-hidden="true">📝</span>
    <h1>待办事项</h1>
    <div class="header-actions">
      <!-- AI 一键总结：把当前所有待办发给后端 /todo/summarize -->
      <button id="summarize-btn" class="btn btn-summarize btn-sm" type="button">
        <span aria-hidden="true">✨</span><span id="summarize-label">一键总结</span>
      </button>
      <!-- AI 助手：展开/收起下面的聊天面板，消息发给后端 /chat -->
      <button id="chat-toggle-btn" class="btn btn-ghost btn-sm" type="button"
              aria-expanded="false" aria-controls="chat-panel">
        <span aria-hidden="true">💬</span><span>AI 助手</span>
      </button>
    </div>
  </header>

  <main class="card">
    <!-- 输入区 -->
    <div class="composer">
      <input id="todo-input" class="input" type="text" maxlength="200"
             placeholder="想做点什么？" autocomplete="off">
      <button id="add-btn" class="btn btn-primary" type="button">
        <span aria-hidden="true">➕</span><span>添加</span>
      </button>
    </div>

    <!-- 骨架屏：仅首次加载时出现 -->
    <div id="skeleton" hidden>
      <div class="skeleton"></div>
      <div class="skeleton"></div>
      <div class="skeleton"></div>
    </div>

    <!-- 列表 -->
    <ul id="todo-list" class="list"></ul>

    <!-- 空状态 -->
    <div id="empty" class="empty" hidden>
      <span class="empty-icon" aria-hidden="true">🗒️</span>
      暂无待办，添加一个吧
    </div>

    <!-- 连不上后端时的自助提示 -->
    <div id="cors-hint" class="hint" hidden></div>
  </main>

  <!--
    AI 聊天面板。
    注意：后端 /chat 每次只接收一条 message，服务端不保存会话，
    所以多轮对话的历史要在前端拼进请求体里（见 buildChatPayload）。
  -->
  <section id="chat-panel" class="card chat-card" hidden>
    <div class="chat-head">
      <span class="chat-title">💬 AI 助手</span>
      <button id="chat-clear-btn" class="btn btn-ghost btn-sm" type="button">清空</button>
      <button id="chat-close-btn" class="btn btn-ghost btn-sm" type="button">收起</button>
    </div>
    <div id="chat-log" class="chat-log" aria-live="polite"></div>
    <div class="composer" style="margin-bottom:0">
      <input id="chat-input" class="input" type="text" maxlength="500"
             placeholder="问问 AI，比如「帮我安排今天的任务」" autocomplete="off">
      <button id="chat-send-btn" class="btn btn-primary" type="button">发送</button>
    </div>
  </section>
</div>

<!-- 通用弹窗（分类 / 优先级 / 拆分 / 总结 / 编辑） -->
<div id="overlay" class="overlay" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div id="modal-icon" class="modal-icon" aria-hidden="true">🏷️</div>
    <h2 id="modal-title" class="modal-title">标题</h2>
    <div id="modal-body" class="modal-body"></div>
    <div id="modal-actions" class="modal-actions"></div>
  </div>
</div>

<!-- Toast 容器 -->
<div id="toasts" aria-live="polite" aria-atomic="false"></div>

<script>
'use strict';

/* ============================================================
   配置
   ============================================================ */
const API_BASE = 'http://127.0.0.1:8080';

/** 后端接口要求「纯文本」请求体；text/plain 属于 CORS 安全类型，不会触发预检 */
const TEXT_HEADERS = { 'Content-Type': 'text/plain;charset=UTF-8' };

/* ============================================================
   DOM 引用
   ============================================================ */
const $ = (id) => document.getElementById(id);

const todoInput    = $('todo-input');
const addBtn       = $('add-btn');
const summarizeBtn = $('summarize-btn');
const summarizeLbl = $('summarize-label');
const todoList     = $('todo-list');
const emptyState   = $('empty');
const skeleton     = $('skeleton');
const corsHint     = $('cors-hint');
const toasts       = $('toasts');
const overlay      = $('overlay');
const modalIcon    = $('modal-icon');
const modalTitle   = $('modal-title');
const modalBody    = $('modal-body');
const modalActions = $('modal-actions');

const chatPanel    = $('chat-panel');
const chatBtn      = $('chat-toggle-btn');
const chatCloseBtn = $('chat-close-btn');
const chatClearBtn = $('chat-clear-btn');
const chatLog      = $('chat-log');
const chatInput    = $('chat-input');
const chatSendBtn  = $('chat-send-btn');

/* ============================================================
   错误类型
   ============================================================ */
class ApiError extends Error {
  /**
   * @param {'NETWORK'|'HTTP'|'PARSE'} kind  失败类型
   * @param {string} message                 给用户看的中文描述
   * @param {string} [detail]                后端 {"error": "..."} 里的具体原因
   */
  constructor(kind, message, detail = '') {
    super(detail ? `${message}：${detail}` : message);
    this.name = 'ApiError';
    this.kind = kind;
    this.detail = detail;
  }
}

/* ============================================================
   容错解析（针对后端没有做 JSON 转义的两个接口）
   ============================================================ */

/**
 * 从后端响应里取出一个字符串字段，允许响应体不是合法 JSON。
 *
 * 为什么必须有这个函数：
 * src/handler.cpp 里只有 classify / summarize / prioritize 走了 json_escape()，
 * 而 /todo/split 和 /chat 是直接把模型输出原样拼进 JSON 的：
 *
 *     body = R"({"subtasks": ")" + subtasks + R"("})";
 *
 * Split() 的提示词要求「用换行分隔」，模型返回的是**真实换行符**；
 * Chat() 的回复里也可能有真实换行或双引号。
 * JSON 的字符串里不允许出现裸换行，所以这两个响应严格来说不是合法 JSON，
 * JSON.parse 一定会抛错。字段本身是能用的，只能在前端容错解析——而不是去动后端。
 *
 * @param {any}    data   已解析出的对象，或解析失败后的原始文本
 * @param {string} field  字段名，如 'subtasks' / 'reply' / 'error'
 * @returns {{ok: boolean, value: string}}
 */
function extractField(data, field) {
  // 1) 正常情况：api() 已经把合法 JSON 解析成对象了
  if (data && typeof data === 'object' && typeof data[field] === 'string') {
    return { ok: true, value: data[field] };
  }
  if (typeof data !== 'string') return { ok: false, value: '' };

  // 2) 还是文本：先按合法 JSON 试一次，这样 \" \\ 之类转义能被正确还原
  //    （模型偶尔返回单行、不含引号的回复时，后端拼出来的就是合法 JSON）
  try {
    const obj = JSON.parse(data);
    if (obj && typeof obj === 'object' && typeof obj[field] === 'string') {
      return { ok: true, value: obj[field] };
    }
  } catch {
    // 不是合法 JSON —— 这正是 /todo/split、/chat 的常见情况，继续往下兜底
  }

  // 3) 兜底：手工剥掉 {"field": " ... "} 外壳。
  //    用贪婪的 [\s\S]* 一路吃到最后一个 " 之前，
  //    这样正文里的换行、引号、大括号都能原样保留。
  const re = new RegExp('^\\s*\\{\\s*"' + field + '"\\s*:\\s*"([\\s\\S]*)"\\s*\\}\\s*$');
  const m = re.exec(data);
  if (!m) return { ok: false, value: '' };
  return { ok: true, value: m[1] };
}

/* ============================================================
   API 层
   ============================================================ */

/**
 * 发请求，拿回未经解析的原始文本。
 * @param {string} path          例：'/todos'、'/todo/3'
 * @param {RequestInit} [options] fetch 配置（body 直接传字符串）
 * @returns {Promise<string>}
 * @throws {ApiError}
 */
async function apiRaw(path, options = {}) {
  let res;
  try {
    res = await fetch(API_BASE + path, options);
  } catch {
    // fetch 仅在网络层失败时抛错：连不上、DNS 失败……
    throw new ApiError('NETWORK', '连不上后端服务');
  }

  const text = await res.text();

  if (!res.ok) {
    // 后端出错时返回 {"error": "..."}，把它透出来，省得只看到一个状态码
    const err = extractField(text, 'error');
    throw new ApiError('HTTP', `请求失败（HTTP ${res.status}）`, err.ok ? err.value : '');
  }

  return text;
}

/**
 * 统一的请求封装。
 * @param {string} path          例：'/todos'、'/todo/3'
 * @param {RequestInit} [options] fetch 配置（body 直接传字符串）
 * @returns {Promise<any>}       解析后的 JSON；响应体为空时返回 null
 * @throws {ApiError}
 */
async function api(path, options = {}) {
  const text = await apiRaw(path, options);
  if (!text) return null;
  try {
    return JSON.parse(text);
  } catch {
    return text;   // 后端返回非 JSON 时原样返回，交给调用方判断
  }
}

/**
 * POST 纯文本 body，并取回一个字符串字段。
 * 专门给 /todo/split 和 /chat 用——它们的响应体没有做 JSON 转义。
 * @param {string} path
 * @param {string} field
 * @param {string} body
 * @returns {Promise<string>}
 */
async function apiTextField(path, field, body) {
  const raw = await apiRaw(path, {
    method: 'POST',
    headers: TEXT_HEADERS,
    body,
  });
  const got = extractField(raw, field);
  if (!got.ok) throw new ApiError('PARSE', '后端返回的内容无法解析');
  return got.value;
}

/** GET /todos → [{id, content}, ...] */
const apiListTodos = () => api('/todos');

/** POST /todo（纯文本 body） */
const apiCreateTodo = (content) => api('/todo', {
  method: 'POST',
  headers: TEXT_HEADERS,
  body: content,
});

/** PUT /todo/:id（纯文本 body） */
const apiUpdateTodo = (id, content) => api(`/todo/${id}`, {
  method: 'PUT',
  headers: TEXT_HEADERS,
  body: content,
});

/** DELETE /todo/:id */
const apiDeleteTodo = (id) => api(`/todo/${id}`, { method: 'DELETE' });

/** POST /todo/classify（纯文本 body）→ {category} */
const apiClassifyTodo = (content) => api('/todo/classify', {
  method: 'POST',
  headers: TEXT_HEADERS,
  body: content,
});

/** POST /todo/prioritize（纯文本 body）→ {priority} */
const apiPrioritizeTodo = (content) => api('/todo/prioritize', {
  method: 'POST',
  headers: TEXT_HEADERS,
  body: content,
});

/** POST /todo/summarize（纯文本 body）→ {summary} */
const apiSummarizeTodos = (text) => api('/todo/summarize', {
  method: 'POST',
  headers: TEXT_HEADERS,
  body: text,
});

/** POST /todo/split（纯文本 body）→ {subtasks}，多行文本 */
const apiSplitTodo = (content) => apiTextField('/todo/split', 'subtasks', content);

/** POST /chat（纯文本 body）→ {reply} */
const apiChat = (message) => apiTextField('/chat', 'reply', message);

/* ============================================================
   Toast
   ============================================================ */

const TOAST_ICONS = { success: '✅', error: '⚠️', info: 'ℹ️' };

/**
 * 顶部弹出提示，3 秒后自动消失。
 * @param {string} message
 * @param {'success'|'error'|'info'} [type='success']
 */
function showToast(message, type = 'success') {
  const el = document.createElement('div');
  el.className = `toast ${type}`;

  const icon = document.createElement('span');
  icon.setAttribute('aria-hidden', 'true');
  icon.textContent = TOAST_ICONS[type] || '';

  const text = document.createElement('span');
  text.textContent = message;          // 用 textContent，避免注入

  el.append(icon, text);
  toasts.appendChild(el);

  setTimeout(() => {
    el.classList.add('is-leaving');
    el.addEventListener('animationend', () => el.remove(), { once: true });
  }, 3000);
}

/* ============================================================
   渲染
   ============================================================ */

/** 当前列表的快照，供「一键总结」取用 */
let currentTodos = [];

/**
 * 切换骨架屏显隐。
 * @param {boolean} on
 */
function setLoading(on) {
  skeleton.hidden = !on;
  if (on) {
    // 加载中先清空列表，避免旧数据残留
    todoList.innerHTML = '';
    emptyState.hidden = true;
  }
}

/**
 * 构建单条待办。
 * @param {{id:number, content:string}} todo
 * @returns {HTMLLIElement}
 */
function createTodoItem(todo) {
  const li = document.createElement('li');
  li.className = 'todo-item';
  li.dataset.id = String(todo.id);

  const content = document.createElement('span');
  content.className = 'todo-content';
  content.textContent = todo.content;      // 纯文本，内容里的标签不会被解析

  const actions = document.createElement('div');
  actions.className = 'todo-actions';
  actions.append(
    makeButton('btn btn-classify btn-sm', '🏷️', '分类',   () => onClassifyClick(todo)),
    makeButton('btn btn-priority btn-sm', '⚡', '优先级', () => onPrioritizeClick(todo)),
    makeButton('btn btn-split btn-sm',    '🧩', '拆分',   () => onSplitClick(todo)),
    makeButton('btn btn-edit btn-sm',     '✏️', '编辑',   () => onEditClick(todo)),
    makeButton('btn btn-danger btn-sm',   '🗑️', '删除',   () => onDeleteClick(todo, li)),
  );

  li.append(content, actions);
  return li;
}

/**
 * 生成一个带 emoji 的按钮。
 */
function makeButton(className, icon, label, onClick) {
  const btn = document.createElement('button');
  btn.type = 'button';
  btn.className = className;
  btn.title = label;             // 超窄屏只显示图标时，悬停仍能看到名称

  const i = document.createElement('span');
  i.setAttribute('aria-hidden', 'true');
  i.textContent = icon;

  const t = document.createElement('span');
  t.textContent = label;

  btn.append(i, t);
  btn.addEventListener('click', onClick);
  return btn;
}

/**
 * 渲染整个列表。
 * @param {Array<{id:number, content:string}>} todos
 */
function renderTodos(todos) {
  currentTodos = todos;          // 记下来，供「一键总结」使用
  todoList.innerHTML = '';

  if (!todos.length) {
    emptyState.hidden = false;
    return;
  }

  emptyState.hidden = true;
  const frag = document.createDocumentFragment();
  for (const todo of todos) frag.appendChild(createTodoItem(todo));
  todoList.appendChild(frag);
}

/* ============================================================
   弹窗
   ============================================================ */

/**
 * 打开弹窗。
 * @param {object} cfg
 * @param {string} cfg.icon
 * @param {string} cfg.title
 * @param {Node|string} [cfg.body]        节点或纯文本
 * @param {Array<{label:string, className?:string, onClick?:Function}>} [cfg.actions]
 */
function openModal({ icon, title, body, actions = [] }) {
  modalIcon.textContent  = icon  || '';
  modalTitle.textContent = title || '';

  modalBody.innerHTML = '';
  if (body instanceof Node)          modalBody.appendChild(body);
  else if (typeof body === 'string') modalBody.textContent = body;

  modalActions.innerHTML = '';
  for (const action of actions) {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = action.className || 'btn btn-primary';
    btn.textContent = action.label;
    btn.addEventListener('click', action.onClick || closeModal);
    modalActions.appendChild(btn);
  }

  overlay.hidden = false;

  // 优先聚焦输入框，否则聚焦第一个按钮
  const focusable = overlay.querySelector('input, button');
  if (focusable) focusable.focus();
}

/** 关闭弹窗并清空内容 */
function closeModal() {
  overlay.hidden = true;
  modalBody.innerHTML = '';
  modalActions.innerHTML = '';
}

// 点击遮罩空白处关闭
overlay.addEventListener('click', (e) => {
  if (e.target === overlay) closeModal();
});

// Esc 关闭：优先关弹窗，没有弹窗时收起聊天面板
document.addEventListener('keydown', (e) => {
  if (e.key !== 'Escape') return;
  if (!overlay.hidden) closeModal();
  else if (!chatPanel.hidden) toggleChat(false);
});

/* ============================================================
   错误处理
   ============================================================ */

/**
 * @param {unknown} err
 * @param {string} fallback  非 ApiError 时的兜底文案
 */
function handleError(err, fallback) {
  console.error(err);
  const message = err instanceof ApiError ? err.message : fallback;
  showToast(message, 'error');
  if (err instanceof ApiError && err.kind === 'NETWORK') showConnectionHint();
}

/* ============================================================
   业务逻辑
   ============================================================ */

/**
 * 加载并渲染列表。
 * @param {{silent?:boolean}} [opts] silent=true 时不显示骨架屏（用于增删改后的刷新）
 */
async function loadTodos({ silent = false } = {}) {
  if (!silent) setLoading(true);
  try {
    const todos = await apiListTodos();
    renderTodos(Array.isArray(todos) ? todos : []);
    corsHint.hidden = true;          // 一旦成功就收起提示
  } catch (err) {
    handleError(err, '加载列表失败');
  } finally {
    if (!silent) setLoading(false);
  }
}

/** 添加：POST /todo */
async function onAddClick() {
  const content = todoInput.value.trim();
  if (!content) {
    showToast('请先输入内容', 'error');
    todoInput.focus();
    return;
  }

  addBtn.disabled = true;
  try {
    await apiCreateTodo(content);
    todoInput.value = '';
    showToast('添加成功', 'success');
    await loadTodos({ silent: true });
  } catch (err) {
    handleError(err, '添加失败');
  } finally {
    addBtn.disabled = false;
    todoInput.focus();
  }
}

/**
 * 分类：POST /todo/classify，用弹窗展示结果。
 * @param {{id:number, content:string}} todo
 */
async function onClassifyClick(todo) {
  // 临时禁用触发按钮，防止重复点击
  const btn = todoList.querySelector(`.todo-item[data-id="${todo.id}"] .btn-classify`);
  if (btn) btn.disabled = true;

  try {
    const data = await apiClassifyTodo(todo.content);
    const category = (data && data.category) ? data.category : '未分类';

    const wrap   = document.createElement('div');
    const source = document.createElement('div');
    source.className = 'modal-source';
    source.textContent = todo.content;

    const cat = document.createElement('div');
    cat.className = 'modal-category';
    cat.textContent = category;      // textContent，后端返回什么都不会被当成代码执行

    wrap.append(source, cat);

    openModal({
      icon: '🏷️',
      title: '智能分类结果',
      body: wrap,
      actions: [{ label: '知道了', className: 'btn btn-primary', onClick: closeModal }],
    });
  } catch (err) {
    handleError(err, '分类失败');
  } finally {
    if (btn) btn.disabled = false;
  }
}

/**
 * 优先级：POST /todo/prioritize，用弹窗展示结果。
 * @param {{id:number, content:string}} todo
 */
async function onPrioritizeClick(todo) {
  const btn = todoList.querySelector(`.todo-item[data-id="${todo.id}"] .btn-priority`);
  if (btn) btn.disabled = true;

  try {
    const data = await apiPrioritizeTodo(todo.content);
    const priority = (data && data.priority) ? String(data.priority).trim() : '中';

    const wrap   = document.createElement('div');
    const source = document.createElement('div');
    source.className = 'modal-source';
    source.textContent = todo.content;

    const badge = document.createElement('div');
    badge.className = 'modal-priority ' + priorityLevelClass(priority);
    badge.textContent = priority;    // textContent，防止返回内容被当成标签解析

    wrap.append(source, badge);

    openModal({
      icon: '⚡',
      title: 'AI 判断的优先级',
      body: wrap,
      actions: [{ label: '知道了', className: 'btn btn-primary', onClick: closeModal }],
    });
  } catch (err) {
    handleError(err, '获取优先级失败');
  } finally {
    if (btn) btn.disabled = false;
  }
}

/**
 * 把后端返回的优先级文字映射成 CSS 类名，用来上色。
 * @param {string} priority
 * @returns {'high'|'mid'|'low'}
 */
function priorityLevelClass(priority) {
  if (priority.includes('高')) return 'high';
  if (priority.includes('低')) return 'low';
  return 'mid';
}

/**
 * 把模型返回的多行文本切成子任务数组。
 * 顺带去掉「1. 」「- 」「• 」这类列表前缀，存进数据库时更干净。
 * @param {string} text
 * @returns {string[]}
 */
function splitLines(text) {
  return String(text)
    .split(/\r?\n/)
    .map((line) => line.replace(/^\s*(?:\d+\s*[.、)．]|[-*•·])\s*/, '').trim())
    .filter(Boolean);
}

/**
 * 拆分任务：POST /todo/split，把一条待办拆成 3~5 个子任务。
 * @param {{id:number, content:string}} todo
 */
async function onSplitClick(todo) {
  const btn = todoList.querySelector(`.todo-item[data-id="${todo.id}"] .btn-split`);
  if (btn) btn.disabled = true;

  try {
    const text = await apiSplitTodo(todo.content);
    const subtasks = splitLines(text);

    const wrap = document.createElement('div');
    const source = document.createElement('div');
    source.className = 'modal-source';
    source.textContent = todo.content;
    wrap.appendChild(source);

    if (subtasks.length > 1) {
      const list = document.createElement('ol');
      list.className = 'modal-subtasks';
      for (const s of subtasks) {
        const li = document.createElement('li');
        li.textContent = s;          // textContent：模型输出不会被当成标签解析
        list.appendChild(li);
      }
      wrap.appendChild(list);
    } else {
      // 模型偶尔不按格式返回（比如兜底值「拆分失败」），原样展示
      const box = document.createElement('div');
      box.className = 'modal-summary';
      box.textContent = text.trim() || '（AI 没有返回内容）';
      wrap.appendChild(box);
    }

    const actions = [{ label: '知道了', className: 'btn btn-primary', onClick: closeModal }];
    if (subtasks.length > 1) {
      actions.unshift({
        label: `全部添加（${subtasks.length}）`,
        className: 'btn btn-ghost',
        onClick: () => addAllSubtasks(subtasks),
      });
    }

    openModal({ icon: '🧩', title: 'AI 拆分的子任务', body: wrap, actions });
  } catch (err) {
    handleError(err, '拆分失败');
  } finally {
    if (btn) btn.disabled = false;
  }
}

/**
 * 把拆出来的子任务逐条 POST /todo 存进后端。
 * 串行发送：后端线程池只有 4 条线程，而且写操作会清缓存，没必要并发。
 * @param {string[]} subtasks
 */
async function addAllSubtasks(subtasks) {
  closeModal();
  try {
    for (const s of subtasks) {
      await apiCreateTodo(s);
    }
    showToast(`已添加 ${subtasks.length} 条待办`, 'success');
    await loadTodos({ silent: true });
  } catch (err) {
    handleError(err, '批量添加失败');
  }
}

/**
 * 一键总结：把当前所有待办拼成一段纯文本，POST /todo/summarize。
 */
async function onSummarizeClick() {
  if (!currentTodos.length) {
    showToast('还没有待办，先添加几个吧', 'error');
    todoInput.focus();
    return;
  }

  // 按钮进入「思考中」状态（AI 调用通常要 1~3 秒）
  summarizeBtn.disabled = true;
  const originalLabel = summarizeLbl.textContent;
  summarizeLbl.textContent = '总结中…';

  try {
    // 后端只收纯文本，这里用分号把各条待办连起来
    const payload = currentTodos.map((t) => t.content).join('；');
    const data = await apiSummarizeTodos(payload);
    const summary = (data && data.summary) ? data.summary : '（AI 没有返回内容）';

    const box = document.createElement('div');
    box.className = 'modal-summary';
    box.textContent = summary;       // textContent，防止返回内容被当成标签解析

    openModal({
      icon: '✨',
      title: 'AI 总结',
      body: box,
      actions: [{ label: '知道了', className: 'btn btn-primary', onClick: closeModal }],
    });
  } catch (err) {
    handleError(err, '总结失败');
  } finally {
    summarizeBtn.disabled = false;
    summarizeLbl.textContent = originalLabel;
  }
}

/**
 * 编辑：弹出输入框，确认后 PUT /todo/:id。
 * @param {{id:number, content:string}} todo
 */
function onEditClick(todo) {
  const input = document.createElement('input');
  input.type = 'text';
  input.className = 'input';
  input.value = todo.content;
  input.maxLength = 200;

  /** 提交修改 */
  async function submit() {
    const next = input.value.trim();
    if (!next) {
      showToast('内容不能为空', 'error');
      input.focus();
      return;
    }
    if (next === todo.content) {   // 没改动就直接关掉，省一次请求
      closeModal();
      return;
    }

    try {
      await apiUpdateTodo(todo.id, next);
      closeModal();
      showToast('修改成功', 'success');
      await loadTodos({ silent: true });
    } catch (err) {
      handleError(err, '修改失败');
    }
  }

  // 回车即保存
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      e.preventDefault();
      submit();
    }
  });

  openModal({
    icon: '✏️',
    title: '编辑待办',
    body: input,
    actions: [
      { label: '取消', className: 'btn btn-ghost',   onClick: closeModal },
      { label: '保存', className: 'btn btn-primary', onClick: submit },
    ],
  });

  // openModal 里已经 focus 过，这里再全选一次，方便直接改写
  input.focus();
  input.select();
}

/**
 * 删除：确认后 DELETE /todo/:id，等淡出动画播完再刷新。
 * @param {{id:number, content:string}} todo
 * @param {HTMLLIElement} li
 */
async function onDeleteClick(todo, li) {
  if (!confirm(`确定删除「${todo.content}」吗？`)) return;

  li.classList.add('is-leaving');   // 先播淡出

  try {
    await apiDeleteTodo(todo.id);
    showToast('删除成功', 'success');
    await new Promise((resolve) => setTimeout(resolve, 220));  // 等动画结束
    await loadTodos({ silent: true });
  } catch (err) {
    li.classList.remove('is-leaving');   // 失败就还原
    handleError(err, '删除失败');
  }
}

/* ============================================================
   AI 聊天（POST /chat）
   ============================================================ */

/**
 * 前端保留的对话历史。
 *
 * 后端的 /chat 每次只把单条 message 拼进提示词（"请回答用户的问题：" + message），
 * 服务端不保存任何会话状态，所以如果不在这里记住上下文，AI 每轮都会失忆
 * ——「那第二个呢？」这种追问就没法回答。发请求时把最近的对话拼成一段文本带过去。
 */
const chatHistory = [];

/** 最多带几轮历史（一轮 = 用户 + 助手），太多会让提示词过长 */
const CHAT_HISTORY_TURNS = 6;

/**
 * 展开 / 收起聊天面板。
 * @param {boolean} [show] 不传则切换
 */
function toggleChat(show) {
  const next = (typeof show === 'boolean') ? show : chatPanel.hidden;
  chatPanel.hidden = !next;
  chatBtn.setAttribute('aria-expanded', String(next));
  if (next) chatInput.focus();
}

/**
 * 往聊天区追加一条消息。
 * @param {string} text
 * @param {'user'|'assistant'|'error'|'typing'} role
 * @returns {HTMLElement} 返回该节点，方便「思考中…」用完删掉
 */
function appendChatMessage(text, role) {
  const el = document.createElement('div');
  el.className = `chat-msg ${role}`;
  el.textContent = text;      // textContent：模型输出不会被当成标签解析
  chatLog.appendChild(el);
  chatLog.scrollTop = chatLog.scrollHeight;
  return el;
}

/**
 * 拼出真正发给后端的文本：把最近的对话一起带上，弥补后端无状态。
 * @param {string} message 本次要问的内容（还没记进 chatHistory）
 * @returns {string}
 */
function buildChatPayload(message) {
  const recent = chatHistory.slice(-CHAT_HISTORY_TURNS * 2);
  if (!recent.length) return message;

  const lines = recent.map((m) => (m.role === 'user' ? '用户：' : '助手：') + m.text);
  lines.push('用户：' + message);
  return lines.join('\n');
}

/** 发送一条消息给 /chat */
async function onChatSend() {
  const message = chatInput.value.trim();
  if (!message) {
    chatInput.focus();
    return;
  }

  chatInput.value = '';
  appendChatMessage(message, 'user');

  // 顺序很重要：先按「发送前」的历史拼 payload，再把这条记进历史，否则会重复
  const payload = buildChatPayload(message);
  chatHistory.push({ role: 'user', text: message });

  // 后端 curl 最长等 15s，期间禁用按钮防止连点（线程池只有 4 条线程）
  chatSendBtn.disabled = true;
  chatInput.disabled = true;
  const typing = appendChatMessage('思考中…', 'typing');

  try {
    const reply = await apiChat(payload);
    typing.remove();
    const text = reply.trim() || '（AI 没有返回内容）';
    appendChatMessage(text, 'assistant');
    chatHistory.push({ role: 'assistant', text });
  } catch (err) {
    console.error(err);
    typing.remove();
    const msg = err instanceof ApiError ? err.message : '聊天失败';
    appendChatMessage(msg, 'error');
    if (err instanceof ApiError && err.kind === 'NETWORK') showConnectionHint();
  } finally {
    chatSendBtn.disabled = false;
    chatInput.disabled = false;
    chatInput.focus();
  }
}

/* ============================================================
   事件绑定 & 初始化
   ============================================================ */
addBtn.addEventListener('click', onAddClick);
summarizeBtn.addEventListener('click', onSummarizeClick);

// ---- AI 聊天面板 ----
chatBtn.addEventListener('click', () => toggleChat());
chatCloseBtn.addEventListener('click', () => toggleChat(false));
chatClearBtn.addEventListener('click', () => {
  chatHistory.length = 0;
  chatLog.innerHTML = '';
  chatInput.focus();
});
chatSendBtn.addEventListener('click', onChatSend);
chatInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') {
    e.preventDefault();
    onChatSend();
  }
});

// 输入框回车也能添加
todoInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') {
    e.preventDefault();
    onAddClick();
  }
});

// 首屏加载
loadTodos();
</script>
